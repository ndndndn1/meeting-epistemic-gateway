services:
  dev:
    image: node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32
    container_name: meeting-epistemic-gateway
    working_dir: /work
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ['/tmp:rw,nosuid,nodev,size=1g,mode=1777']
    volumes:
      - ${MEG_WORKSPACE:-..}:/work
      - ${MEG_NPM_CACHE:?Set MEG_NPM_CACHE}:/npm-cache
      - ${MEG_ARTIFACTS:?Set MEG_ARTIFACTS}:/artifacts
    environment:
      npm_config_cache: /npm-cache
      HTTP_PROXY: http://squid-proxy:3128
      HTTPS_PROXY: http://squid-proxy:3128
      npm_config_proxy: http://squid-proxy:3128
      npm_config_https_proxy: http://squid-proxy:3128
    networks: [proxy-net]
    command: [sh, -c, 'trap "exit 0" TERM INT; while :; do sleep 30; done']
    restart: 'no'
networks:
  proxy-net:
    external: true
