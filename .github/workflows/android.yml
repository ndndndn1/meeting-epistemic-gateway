name: Android build and policy tests
on:
  workflow_dispatch:
  pull_request:
    paths: ["android/**", "contracts/**", "scripts/bootstrap.py"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.15729638' 'cmake;3.31.6'
      - run: python3 scripts/bootstrap.py android
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-for-distribution-debug-build
          path: android/app/build/outputs/apk/debug/*.apk
